<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="build" content="__BUILD_SHA__" />
    <title>sched-prod · incidents</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header>
      <h1>incidents</h1>
      <p class="sub">sched-prod · tonight · times in your local zone · pick a row to open it</p>
    </header>
    <main data-testid="board" aria-busy="true">
      <p class="status" role="alert" hidden></p>
      <div data-testid="loader" class="loader" role="status"><span class="spin" aria-hidden="true"></span> Loading incidents…</div>
      <p data-testid="empty" class="empty" hidden>No incidents tonight.</p>
      <ul data-testid="incident-list" class="list" hidden></ul>
    </main>
    <aside data-testid="incident-panel" class="panel" aria-label="Incident" hidden>
      <button type="button" class="p-close" aria-label="Close">×</button>
      <h2 class="p-id"></h2>
      <p><span class="p-sev"></span> · opened <time class="p-time"></time></p>
      <p class="p-what"></p>
      <button type="button" data-testid="panel-ack" class="p-ack">Ack</button>
      <p class="p-acked" hidden></p>
    </aside>
    <footer>sched-prod incident board · build <code data-testid="build-sha">__BUILD_SHA__</code></footer>
  </body>
</html>
